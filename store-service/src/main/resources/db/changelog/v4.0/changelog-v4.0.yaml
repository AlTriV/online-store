databaseChangeLog:
  - changeSet:
      id: "add_table_users"
      author: "avtry"
      comment: "Add table users"
      changes:
        - sqlFile:
            path: add_table_users.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: add_table_users_rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: "add_username_to_orders"
      author: "avtry"
      comment: "Add column username to orders table"
      changes:
        - sqlFile:
            path: alter_orders_add_username.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: alter_orders_add_username_rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: "add_username_to_wallet"
      author: "avtry"
      comment: "Add column username to wallet table"
      changes:
        - sqlFile:
            path: alter_wallet_add_username.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: alter_wallet_add_username_rollback.sql
            relativeToChangelogFile: true