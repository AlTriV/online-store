<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Витрина товаров</title>
</head>

<body>
    <a href="/store/orders" style="float:right;" th:if="${not isAnonymous and not isAdmin}">
        <b>ЗАКАЗЫ &cudarrr;</b>
    </a>
    <a href="/store/cart/items" style="float:right;" th:if="${not isAnonymous and not isAdmin}">
        <b>КОРЗИНА &cudarrr;</b>
    </a>
    <a href="/store/main/items" style="float:right;">
        <b>ГЛАВНАЯ &cudarrr;</b>
    </a>
    <div style="width:70%;margin-left:auto;margin-right:auto;">
        <p>
            <img width="300" height="300" th:src="${'http://localhost:8080/store/items/'+item.getId()+'/image'}">
        </p>
        <p>
            <b th:text="${item.getTitle()}"></b>
            <b th:text="${item.getPrice()}+' руб.'" style="text-align:right;"></b>
        </p>
        <p>
            <span th:text="${item.getDescription()}"></span>
        </p>
        <form th:action="${'/store/items/'+item.getId()}" method="post" enctype="multipart/form-data" th:if="${not isAnonymous and not isAdmin}">
            <button name="action" value="MINUS">-</button>
            <span th:text="${item.getCount()}"></span>
            <button name="action" value="PLUS">+</button>
            <button name="action" value="PLUS" th:if="${item.getCount()==0}" style="float:right;">В корзину</button>
        </form>
    </div>
</body>

</html>
